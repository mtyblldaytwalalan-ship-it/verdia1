<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فيرديا | Verdia Natural Skincare</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07251a;--bg2:#0c3324;--card:#0a2d20;--gold:#d4af6a;--gold2:#f1dba6;--cream:#f6efdd;--mut:#b9c7b8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--cream);font-family:'Tajawal',system-ui,sans-serif;line-height:1.8;overflow-x:hidden}
.en{font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:.12em}
nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 5vw;background:rgba(7,37,26,.88);backdrop-filter:blur(10px);border-bottom:1px solid #d4af6a44}
nav .brand{display:flex;align-items:center;gap:10px;font-size:22px;color:var(--gold2)}
nav ul{display:flex;gap:26px;list-style:none;padding:0}
nav a{color:var(--cream);text-decoration:none;font-size:15px}
nav a:hover{color:var(--gold)}
.cartbtn{background:none;border:1px solid var(--gold);color:var(--gold2);border-radius:30px;padding:6px 16px;font:inherit;cursor:pointer}
.hero{position:relative;min-height:88vh;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:20px;padding:50px 6vw;background:radial-gradient(circle at 75% 45%,#17573d 0,transparent 55%),linear-gradient(160deg,var(--bg2),var(--bg));overflow:hidden}
.hero h1{font-size:clamp(38px,6vw,72px);line-height:1.25;font-weight:700;background:linear-gradient(100deg,var(--gold2),var(--gold),var(--gold2));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.hero p{max-width:520px;color:var(--mut);font-size:18px;margin:18px 0 30px}
.btn{display:inline-block;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#07251a;font-weight:700;border:0;border-radius:40px;padding:13px 34px;font:700 16px 'Tajawal';cursor:pointer;text-decoration:none;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px #d4af6a55}
.logoWrap{position:relative;display:grid;place-items:center}
.logoWrap .ring{position:absolute;width:min(380px,78vw);aspect-ratio:1;border-radius:50%;border:1px dashed var(--gold);animation:spin 40s linear infinite}
.logoWrap .ring.r2{width:min(440px,90vw);border-style:solid;border-color:#d4af6a33;animation-direction:reverse;animation-duration:60s}
.logo{width:min(320px,66vw);border-radius:50%;box-shadow:0 0 80px #d4af6a55;animation:float 6s ease-in-out infinite}
.leaf{position:absolute;width:28px;height:50px;background:linear-gradient(var(--gold2),var(--gold));border-radius:0 100% 0 100%;opacity:.5;animation:fall 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
